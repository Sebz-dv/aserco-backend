services:
  mysql:
    image: mysql:8.0
    container_name: aserco-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aserco_app
      MYSQL_USER: aserco
      MYSQL_PASSWORD: aserco123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
